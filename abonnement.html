</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><b>Marck-Land Ahouansou</b><i aria-hidden="true"></i></a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="index.html" data-page="index.html">Accueil</a>
      <a href="articles.html" data-page="articles.html">Articles</a>
      <a href="a-propos.html" data-page="a-propos.html">À propos</a>

      <a href="https://marckland.com">Portfolio ↗</a>
    </nav>
  </div>
</header>

<main class="narrow article" id="abonnement" style="padding-bottom:80px">
  <h1>Abonnement</h1>
  <div id="etat"></div>
  <div id="formulaire"></div>
</main>

<footer class="site-footer">
  <div class="wrap"><span>© <span id="year">2026</span> Marck-Land Ahouansou · Québec</span><span>Les opinions exprimées ici sont personnelles.</span></div>
</footer>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="assets/common.js?v=8"></script>
<script>
(async function () {
  const p = new URLSearchParams(location.search);
  const etat = document.getElementById('etat');
  const box = document.getElementById('formulaire');
  const note = (title, text, ok) => etat.replaceChildren(h('div', { class: 'notice', role: 'status', style: { borderStyle: 'solid', borderColor: ok ? '#C4E2D3' : 'var(--danger-line)', background: ok ? 'var(--accent-tint)' : '#FBEDEA' } },
    h('p', { style: { margin: '0 0 4px', fontWeight: 600, fontFamily: 'var(--sans)' }, text: title }), h('p', { style: { margin: 0 }, text: text })));

  if (p.get('confirmer')) {
    note('Confirmation…', 'Un instant.', true);
    const r = await newsletter('confirm', { token: p.get('confirmer') });
    if (r.error) note('Lien expiré', r.error, false);
    else { note('C\u2019est confirmé, merci !', 'Tu recevras un courriel à chaque nouvel article.', true); box.replaceChildren(h('a', { class: 'btn', href: 'index.html' }, 'Lire les articles')); }
    history.replaceState(null, '', 'abonnement.html');
    return;
  }
  if (p.get('desabonner')) {
    note('Désabonnement…', 'Un instant.', true);
    const r = await newsletter('unsubscribe', { token: p.get('desabonner') });
    if (r.error) note('Lien invalide', r.error, false);
    else note('Tu es désabonné.', 'Tu ne recevras plus de courriels. Tu peux te réabonner quand tu veux ci-dessous.', true);
    history.replaceState(null, '', 'abonnement.html');
  }
  box.replaceChildren(subscribeBox());
})();
</script>
</body>
</html>

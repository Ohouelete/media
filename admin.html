<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace privé — Marck-Land Ahouansou</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316191D'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='17' font-weight='700' fill='%23F7F5F0' text-anchor='middle'%3EM%3C/text%3E%3Ccircle cx='25' cy='21' r='2.2' fill='%237EE0B5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/quill.snow.css">
<link rel="stylesheet" href="assets/style.css?v=10">
<style>
body{background:#F1EEE7;font-family:var(--sans);font-size:15px;line-height:1.5}
.topbar{background:var(--ink);color:var(--bg)}
.topbar .wrap{max-width:none;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-top:12px;padding-bottom:12px}
.topbar b{font-family:var(--serif);font-size:19px}
.badge{font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid #4A525B;border-radius:6px;color:#B6C0CC;margin-left:10px}
.topbar a{color:#7EE0B5}
.topbar button{min-height:40px;padding:8px 14px;background:transparent;color:var(--bg);border:1px solid #4A525B;border-radius:8px;font:inherit;cursor:pointer}
.layout{display:flex;flex-wrap:wrap}
.side{flex:1 1 220px;max-width:250px;padding:20px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
.side button{text-align:left;min-height:44px;padding:10px 14px;border-radius:10px;border:0;background:transparent;color:var(--ink);font:inherit;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.side button:hover{background:#E6E2D8}
.side button[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:500}
.side .count{color:var(--muted)} .side button[aria-current="page"] .count{color:#B6C0CC}
.panel{flex:999 1 560px;min-width:0;padding:28px 32px 64px}
.panel h1{margin:0 0 18px;font-size:26px;font-weight:600}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.stat{flex:1 1 160px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat span{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)} .stat b{font-size:26px}
.table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #ECE8DF;vertical-align:middle}
th{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td.title{font-family:var(--serif);font-size:17px;font-weight:600}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.pill.draft{background:#ECE8DF;color:#4A525B} .pill.live{background:var(--accent-tint);color:var(--accent-dark)} .pill.sched{background:#E4ECF7;color:#1F4E8C}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.editor-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.editor-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:10px}
.editor-side{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:16px}
.editor-main label,.editor-side label,.editor-side legend{font-weight:600}
.f{width:100%;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink);font:16px var(--sans)}
.f-title{font:700 28px var(--serif)} .f-lede{font:18px/1.5 var(--serif);resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:0}
#quill{min-height:420px;background:#fff;font:19px/1.7 var(--serif)}
.ql-toolbar.ql-snow{border-radius:10px 10px 0 0;border-color:var(--line2);background:#FBFAF7}
.ql-container.ql-snow{border-radius:0 0 10px 10px;border-color:var(--line2);font:inherit}
.ql-editor{min-height:420px;font:19px/1.7 var(--serif)} .ql-editor h2{font-size:28px} .ql-editor h3{font-size:22px}
.ql-editor blockquote{border-left:3px solid var(--accent) !important;font-style:italic}
.cover-prev{width:100%;aspect-ratio:16/9;border-radius:10px;border:1px dashed var(--line2);background:#FBFAF7 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.radio{display:flex;gap:10px;align-items:center;min-height:36px;font-weight:400 !important}
.stack{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:15px;z-index:50;max-width:90vw}
.toast.err{background:var(--danger)}
.login{max-width:420px;margin:10vh auto;padding:0 24px}
.word{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line2)}
.word button{width:30px;height:30px;border-radius:50%;border:0;background:#F1EEE7;cursor:pointer}
.editor-wrap{position:relative}
.img-bar{position:absolute;right:12px;z-index:5;display:flex;gap:6px;padding:6px;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.table-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:#FBFAF7;border:1px solid var(--line2);border-radius:10px}
.ql-snow .ql-toolbar button.ql-caption,.ql-snow .ql-toolbar button.ql-table,.ql-snow.ql-toolbar button.ql-caption,.ql-snow.ql-toolbar button.ql-table{width:auto;padding:3px 8px;font:500 13px var(--sans);color:#444}
.ql-snow.ql-toolbar button.ql-divider{font:600 16px var(--sans);color:#444}
.ql-editor hr{border:0;height:1px;background:var(--line2);margin:1.6em auto;width:40%}
.ql-editor table{border-collapse:collapse;width:100%}.ql-editor td{border:1px solid var(--line2);padding:6px 10px}
.ql-editor img{cursor:pointer}
.ql-editor iframe.ql-video{width:100%;aspect-ratio:16/9;height:auto}
.cat-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #ECE8DF}
.cat-row .f{flex:1 1 200px;width:auto}
</style>
</head>
<body>

<div id="vue-login" class="login" hidden>
  <p class="kicker">Espace privé</p>
  <h1 style="font-family:var(--serif);font-size:34px;margin:6px 0 20px">Connexion</h1>
  <form id="form-login" class="form">
    <label for="l-email">Courriel</label>
    <input class="f" id="l-email" type="email" autocomplete="username" value="amarckland@gmail.com" required>
    <label for="l-pass">Mot de passe</label>
    <input class="f" id="l-pass" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Se connecter</button>
    <p id="l-msg" class="hint" role="status"></p>
    <button type="button" id="l-oubli" class="sans-link" style="background:none;border:0;padding:0;color:var(--accent);text-align:left;cursor:pointer;text-decoration:underline">Mot de passe oublié ?</button>
  </form>
  <p class="hint" style="margin-top:16px"><a href="index.html">← Retour au site</a></p>
</div>

<div id="vue-nouveau-mdp" class="login" hidden>
  <h1 style="font-family:var(--serif);font-size:30px;margin:0 0 20px">Choisis un nouveau mot de passe</h1>
  <form id="form-mdp" class="form">
    <label for="n-pass">Nouveau mot de passe</label>
    <input class="f" id="n-pass" type="password" autocomplete="new-password" minlength="8" required>
    <button class="btn" type="submit">Enregistrer</button>
    <p id="n-msg" class="hint" role="status"></p>
  </form>
</div>

<div id="vue-app" hidden>
  <header class="topbar">
    <div class="wrap">
      <div><b>Marck-Land Ahouansou</b><span class="badge">Espace privé</span></div>
      <div style="display:flex;gap:10px;align-items:center"><a href="index.html" target="_blank" rel="noopener">Voir le site ↗</a><button type="button" id="logout">Se déconnecter</button></div>
    </div>
  </header>
  <div class="layout">
    <nav class="side" aria-label="Menu de l'espace privé">
      <button type="button" data-tab="articles">Mes articles <span class="count" id="n-art"></span></button>
      <button type="button" data-tab="editeur">+ Nouvel article</button>
      <button type="button" data-tab="commentaires">Commentaires <span class="count" id="n-com"></span></button>
      <button type="button" data-tab="messages">Messages <span class="count" id="n-msg"></span></button>
      <button type="button" data-tab="abonnes">Abonnés</button>
      <button type="button" data-tab="categories">Catégories</button>
      <button type="button" data-tab="mots">Mots filtrés</button>
    </nav>
    <main class="panel" id="panel"></main>
  </div>
</div>

<script src="assets/vendor/supabase.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="assets/vendor/quill.js"></script>
<script src="assets/common.js?v=10"></script>
<script src="assets/admin.js?v=10"></script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article — Marck-Land Ahouansou</title>
<meta name="description" content="Un article de Marck-Land Ahouansou.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316191D'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='17' font-weight='700' fill='%23F7F5F0' text-anchor='middle'%3EM%3C/text%3E%3Ccircle cx='25' cy='21' r='2.2' fill='%237EE0B5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><b>Marck-Land Ahouansou</b><i aria-hidden="true"></i></a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="index.html" data-page="index.html">Accueil</a>
      <a href="articles.html" data-page="articles.html">Articles</a>
      <a href="a-propos.html" data-page="a-propos.html">À propos</a>
      <a href="abonnement.html" data-page="abonnement.html">S'abonner</a>
      <a href="https://marckland.com">Portfolio ↗</a>
    </nav>
  </div>
</header>

<main id="contenu">
  <article class="narrow article" id="article">
    <div class="skeleton" style="height:14px;width:200px"></div>
    <div class="skeleton" style="height:110px"></div>
    <div class="skeleton" style="height:60px"></div>
    <div class="skeleton" style="height:300px"></div>
  </article>

  <section class="narrow comments" id="commentaires" aria-labelledby="titre-com" hidden>
    <h2 id="titre-com">Commentaires</h2>
    <form class="form" id="form-com" novalidate>
      <div id="com-qui" class="com-qui" hidden>Tu commentes en tant que <b id="com-qui-nom"></b> · <button type="button" id="com-changer">Changer de nom</button></div>
      <div id="com-nom-bloc" class="stack-sm">
        <label for="com-nom">Ton nom</label>
        <input class="field" id="com-nom" name="nom" type="text" maxlength="60" autocomplete="name" placeholder="Prénom ou pseudonyme" required>
      </div>
      <label for="com-texte">Ton commentaire</label>
      <textarea class="field" id="com-texte" name="texte" maxlength="3000" placeholder="Écris ton commentaire…" required></textarea>
      <div class="hp" aria-hidden="true"><label for="com-site">Ne pas remplir</label><input id="com-site" name="site" type="text" tabindex="-1" autocomplete="off"></div>
      <div class="form-foot">
        <small id="com-msg" role="status">Pas besoin de compte. Ton commentaire s'affiche tout de suite.</small>
        <button class="btn" type="submit" id="com-btn">Publier le commentaire</button>
      </div>
    </form>
    <div id="liste-com"></div>
  </section>

  <section class="narrow" id="abo" style="padding-top:40px" hidden></section>

  <section class="related" id="similaires" aria-labelledby="titre-sim" hidden>
    <div class="wrap">
      <h2 id="titre-sim">À lire aussi</h2>
      <div class="grid" id="grille-sim"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap"><span>© <span id="year">2026</span> Marck-Land Ahouansou · Québec</span><span>Les opinions exprimées ici sont personnelles.</span></div>
</footer>

<script src="assets/vendor/supabase.js"></script>
<script src="assets/vendor/purify.min.js"></script>
<script src="assets/common.js?v=8"></script>
<script>
(async function () {
  const slug = new URLSearchParams(location.search).get('a') || '';
  const box = document.getElementById('article');

  const { data: a, error } = slug
    ? await db.from('articles').select(ARTICLE_FIELDS).eq('slug', slug).maybeSingle()
    : { data: null, error: null };

  if (error) { showError(box, 'Impossible de charger cet article pour le moment.'); return; }
  if (!a) {
    box.replaceChildren(h('h1', { text: 'Article introuvable' }),
      h('p', { class: 'lede', text: 'Ce lien ne mène à aucun article publié. Il a peut-être été retiré.' }),
      h('div', {}, h('a', { class: 'btn', href: 'articles.html' }, 'Voir tous les articles')));
    return;
  }

  document.title = a.title + ' — ' + SITE_NAME;
  const desc = document.querySelector('meta[name="description"]');
  if (desc && a.lede) desc.setAttribute('content', a.lede);

  // Compteur de vues : une vue par lecteur et par article toutes les 6 heures.
  let views = a.views;
  try {
    const key = 'vu:' + a.slug, last = Number(localStorage.getItem(key) || 0);
    if (Date.now() - last > 6 * 3600 * 1000) {
      const r = await db.rpc('increment_view', { p_slug: a.slug });
      if (!r.error && r.data != null) views = r.data;
      localStorage.setItem(key, String(Date.now()));
    }
  } catch (e) {
    const r = await db.rpc('increment_view', { p_slug: a.slug });
    if (!r.error && r.data != null) views = r.data;
  }

  let nbCom = commentCount(a);
  const metaCom = h('span', { text: plural(nbCom, 'commentaire', 'commentaires') });
  const pageUrl = location.href.split('#')[0];
  const enc = encodeURIComponent(pageUrl), encT = encodeURIComponent(a.title);
  const ICONS = {
    linkedin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#0A66C2" d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>',
    facebook: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.51c-1.5 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#25D366" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35zM12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.82 9.82 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.88 9.88zm8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.42z"/></svg>',
    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#111" d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.59-6.64 7.59H.47l8.6-9.83L0 1.15h7.59l5.24 6.93 6.07-6.93zm-1.29 19.49h2.04L6.49 3.24H4.3l13.31 17.4z"/></svg>',
    lien: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#3B434C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
    ok: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#1F7A55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
  };
  function shareLink(href, label, icon) {
    const a = h('a', { href, target: '_blank', rel: 'noopener', 'aria-label': 'Partager sur ' + label, title: label });
    a.innerHTML = ICONS[icon];
    return a;
  }
  const copyBtn = h('button', { type: 'button', 'aria-label': 'Copier le lien', title: 'Copier le lien' });
  copyBtn.innerHTML = ICONS.lien;
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(pageUrl); copyBtn.innerHTML = ICONS.ok; copyBtn.title = 'Lien copié'; }
    catch (e) { copyBtn.title = 'Copie impossible'; }
    setTimeout(() => { copyBtn.innerHTML = ICONS.lien; copyBtn.title = 'Copier le lien'; }, 2500);
  });
  const shareBox = h('div', { class: 'share-end' },
    h('span', { class: 'share-label', text: 'Partager cet article' }),
    h('div', { class: 'share-icons', role: 'group', 'aria-label': 'Partager' },
      shareLink('https://www.facebook.com/sharer/sharer.php?u=' + enc, 'Facebook', 'facebook'),
      shareLink('https://wa.me/?text=' + encT + '%20' + enc, 'WhatsApp', 'whatsapp'),
      shareLink('https://www.linkedin.com/sharing/share-offsite/?url=' + enc, 'LinkedIn', 'linkedin'),
      shareLink('https://twitter.com/intent/tweet?url=' + enc + '&text=' + encT, 'X', 'x'),
      copyBtn));

  const body = h('div', { class: 'prose' });
  body.innerHTML = cleanHTML(a.content);
  body.querySelectorAll('a[href^="http"]').forEach(l => { l.target = '_blank'; l.rel = 'noopener'; });

  box.replaceChildren(...[
    h('nav', { class: 'crumbs', 'aria-label': 'Fil d’Ariane' },
      h('a', { href: 'articles.html', text: 'Articles' }),
      a.category ? [' / ', h('a', { href: categoryUrl(a.category.slug), style: { color: 'var(--accent)' }, text: a.category.name })] : null),
    h('h1', { text: a.title }),
    a.lede ? h('p', { class: 'lede', text: a.lede }) : null,
    h('p', { class: 'article-meta' },
      'Publié le ' + fmtDateTime(a.published_at),
      a.updated_at ? ' · mis à jour le ' + fmtDateTime(a.updated_at) : null,
      ' · ' + readMinutes(a.content) + ' min de lecture · ' + plural(views, 'vue', 'vues') + ' · ', metaCom),
    a.cover_url ? h('img', { class: 'cover', src: a.cover_url, alt: '' }) : null,
    body,
    a.tags && a.tags.length ? h('div', { class: 'tags' }, a.tags.map(t => h('a', { href: 'articles.html?q=' + encodeURIComponent(t), text: t }))) : null,
    shareBox

  ].filter(Boolean));

  const abo = document.getElementById('abo'); abo.append(subscribeBox({ title: 'Tu as aimé ce texte ?', lede: 'Reçois les prochains articles par courriel, dès leur publication.' })); abo.hidden = false;

  // ----- Commentaires -----
  const secCom = document.getElementById('commentaires');
  const listeCom = document.getElementById('liste-com');
  const titreCom = document.getElementById('titre-com');
  secCom.hidden = false;

  function comEl(c) {
    return h('div', { class: 'comment' },
      h('div', { class: 'avatar', 'aria-hidden': 'true', text: (c.author || '?').trim().charAt(0).toUpperCase() }),
      h('div', { class: 'comment-body' },
        h('div', { class: 'comment-head' }, h('strong', { text: c.author }), h('span', { class: 'meta', style: { fontSize: '12px' }, text: fmtDateTime(c.created_at) })),
        h('p', { text: c.body })));
  }
  function setCount(n) { nbCom = n; titreCom.textContent = 'Commentaires (' + fmtNumber(n) + ')'; metaCom.textContent = plural(n, 'commentaire', 'commentaires'); }

  const coms = await db.from('comments').select('id,author,body,created_at').eq('article_id', a.id).order('created_at', { ascending: false });
  const comList = coms.data || [];
  setCount(comList.length);
  listeCom.replaceChildren(...(comList.length ? comList.map(comEl) : [h('p', { class: 'meta', id: 'aucun-com', text: 'Sois la première personne à commenter.' })]));

  const form = document.getElementById('form-com');
  const msg = document.getElementById('com-msg');
  const btn = document.getElementById('com-btn');
  const qui = document.getElementById('com-qui'), quiNom = document.getElementById('com-qui-nom'), nomBloc = document.getElementById('com-nom-bloc');
  function showKnown(n) { form.nom.value = n; quiNom.textContent = n; qui.hidden = false; nomBloc.hidden = true; }
  document.getElementById('com-changer').addEventListener('click', () => { qui.hidden = true; nomBloc.hidden = false; form.nom.focus(); form.nom.select(); });
  try { const n = localStorage.getItem('com-nom'); if (n) showKnown(n); } catch (e) {}
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const nom = form.nom.value.trim(), texte = form.texte.value.trim();
    if (!nom) { qui.hidden = true; nomBloc.hidden = false; msg.textContent = 'Indique ton nom.'; msg.className = 'error'; form.nom.focus(); return; }
    if (texte.length < 2) { msg.textContent = 'Écris un commentaire.'; msg.className = 'error'; return; }
    btn.disabled = true; msg.className = ''; msg.textContent = 'Envoi…';
    const { data, error } = await db.rpc('add_comment', { p_slug: a.slug, p_author: nom, p_body: texte, p_website: form.site.value });
    btn.disabled = false;
    if (error) { msg.className = 'error'; msg.textContent = error.message || 'Le commentaire n’a pas pu être publié.'; return; }
    try { localStorage.setItem('com-nom', nom); } catch (e2) {}
    form.texte.value = ''; msg.textContent = 'Merci, ton commentaire est publié.';
    showKnown(nom);
    if (data) {
      document.getElementById('aucun-com')?.remove();
      listeCom.prepend(comEl(data));
      setCount(nbCom + 1);
    }
  });

  // ----- Articles similaires -----
  let sim = [];
  if (a.category) {
    const r = await db.from('articles').select(ARTICLE_FIELDS).eq('category_id', a.category.id).neq('id', a.id).order('published_at', { ascending: false }).limit(3);
    sim = r.data || [];
  }
  if (sim.length < 3) {
    const r = await db.from('articles').select(ARTICLE_FIELDS).neq('id', a.id).order('published_at', { ascending: false }).limit(6);
    for (const x of (r.data || [])) if (sim.length < 3 && !sim.some(s => s.id === x.id)) sim.push(x);
  }
  if (sim.length) {
    document.getElementById('grille-sim').replaceChildren(...sim.map(x => articleCard(x)));
    document.getElementById('similaires').hidden = false;
  }
})();
</script>
</body>
</html>
